<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Academic homepage — Software Engineering, Code Retrieval, Multimodal Learning and LLMs">
  <title>Academic Homepage</title>
  <link rel="stylesheet" href="style.css">
  <script src="content.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <header class="header"><div class="wrap topbar">
    <a class="brand" href="#top" id="brand"></a>
    <nav class="nav" aria-label="Primary navigation">
      <a href="#about" data-nav="about"></a><a href="#research" data-nav="research"></a>
      <a href="#education" data-nav="education"></a><a href="#projects" data-nav="projects"></a>
      <a href="#contact" data-nav="contact"></a>
      <button class="lang" id="langBtn" type="button" aria-label="Switch language">中文</button>
    </nav>
  </div></header>
  <div class="wrap layout" id="top">
    <aside class="profile">
      <div class="portrait" id="portrait" aria-label="Profile photo or initials"></div>
      <h1 id="name"></h1><p class="position" id="position"></p>
      <p class="university" id="university"></p>
      <div class="profile-links"><a id="profileEmail"></a><a id="profileGithub" target="_blank" rel="noopener noreferrer">GitHub ↗</a></div>
    </aside>
    <main>
      <section id="about"><span class="eyebrow" data-eyebrow="about"></span><h2 data-title="about"></h2><div id="aboutContent"></div></section>
      <section id="research"><span class="eyebrow" data-eyebrow="research"></span><h2 data-title="research"></h2><div class="interests" id="researchContent"></div></section>
      <section id="education"><span class="eyebrow" data-eyebrow="education"></span><h2 data-title="education"></h2><div id="educationContent"></div></section>
      <section id="projects"><span class="eyebrow" data-eyebrow="projects"></span><h2 data-title="projects"></h2><div id="projectsContent" class="projects"></div></section>
      <section id="publications" hidden><span class="eyebrow" data-eyebrow="publications"></span><h2 data-title="publications"></h2><div id="publicationsContent"></div></section>
      <section id="contact"><span class="eyebrow" data-eyebrow="contact"></span><h2 data-title="contact"></h2><p id="contactContent"></p><p><a id="contactEmail"></a> · <a id="contactGithub" target="_blank" rel="noopener noreferrer">GitHub</a></p></section>
    </main>
  </div>
  <footer><div class="wrap" id="footer"></div></footer>
</body>
</html>
